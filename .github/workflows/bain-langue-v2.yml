name: Build Bain de Francais v2

on:
  push:
    branches: [bain-langue-v2-build]
    paths:
      - 'bain-langue-v2/**'
      - '.github/workflows/bain-langue-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build installable test APK
        run: gradle -p bain-langue-v2 assembleDebug --stacktrace
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp bain-langue-v2/app/build/outputs/apk/debug/app-debug.apk dist/Bain-de-Francais-APP-MADA-v2.0-TEST.apk
          sha256sum dist/Bain-de-Francais-APP-MADA-v2.0-TEST.apk > dist/SHA256.txt
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bain-de-Francais-APP-MADA-v2.0-TEST
          path: dist/*
          if-no-files-found: error
